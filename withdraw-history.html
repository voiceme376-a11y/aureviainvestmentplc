<div class="ambient"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div><div class="grid-floor"></div></div>
<div class="live-hero-image" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html" aria-label="Aurevia home"><img class="brand-logo-img" src="assets/images/aurevia-logo-3d.png" alt="Aurevia Investment PLC"><span>AUREVIA <small>4D PLATFORM</small></span></a>

<div class="ticker"><div class="ticker-label">MARKET DATA</div><div id="tickerTrack"></div></div>
<section class="content"></section>
    
<footer class="footer">
Aurevia Platform · Cloudflare-connected account workspace</footer>
